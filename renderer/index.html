function wallPanel(b) {
  const lab = (t, cls) => { const d = document.createElement('div'); d.className = 'lbl' + (cls ? ' ' + cls : ''); d.textContent = t; b.appendChild(d); return d; };
  const chips = (arr, act, fn) => {

    arr.forEach(([k, l]) => { const c = document.createElement('div'); c.className = 'chip' + (k === act ? ' act' : ''); c.textContent = l;
      c.onclick = () => { fn(k); [...d.children].forEach((x, i) => x.classList.toggle('act', arr[i][0] === k)); }; d.appendChild(c); });
    b.appendChild(d); return d;
  };
  lab('Wallpaper con el sonido de la canción');
  chips([['off', 'Desactivado'], ['away', 'Paisaje que se aleja'], ['toward', 'Paisaje que se acerca']], CFG.wall, (k) => { CFG.wall = k; saveCfg(); wallApply(); });
  lab('Se aleja: los últimos segundos de música como un paisaje que se pierde en la distancia, para ver cómo vuelve el drop.', 'gest');
  lab('Se acerca: un paisaje que avanza hacia ti bajo un sol bajo. Cada fila de colinas es el espectro y las montañas de los lados suben cuando suena fuerte.', 'gest');
  lab('Fuente de audio');
  chips([['auto', 'Audio del sistema'], ['sim', 'Simulado']], CFG.wsrc, (k) => { CFG.wsrc = k; saveCfg(); if (k === 'sim') audioStop(); else if (CFG.wall !== 'off') audioInit(true); });
  const st = lab('', 'gest'), tick = () => { st.textContent = CFG.wsrc === 'sim' ? 'Espectro simulado.' : AU.ok ? 'Capturando el audio del sistema.' : AU.err ? 'No se pudo capturar el audio (' + AU.err + '). Se usa un espectro simulado.' : 'Iniciando la captura de audio.'; };
  tick(); const tm = setInterval(() => { if (!st.isConnected) clearInterval(tm); else tick(); }, 700);
  const d = lab(''), setT = (v) => (d.textContent = 'Intensidad: ' + v + '%'); setT(Math.round(CFG.wamp * 100));
  const r = document.createElement('input'); r.type = 'range'; r.min = 40; r.max = 200; r.value = Math.round(CFG.wamp * 100); r.style.accentColor = 'var(--c1)';
  r.oninput = () => { setT(+r.value); CFG.wamp = r.value / 100; }; r.onchange = saveCfg; b.appendChild(r);
  lab('Fluidez'); chips([['60', '60 fps'], ['30', '30 fps']], String(CFG.wfps), (k) => { CFG.wfps = +k; saveCfg(); });
  lab('Con el wallpaper activo la ventana se ancla al fondo para no tapar otras ventanas. La imagen ocupa toda la pantalla y cubre los iconos del escritorio (los clics siguen llegando a ellos).', 'gest');
}
const LYR_FONTS = [['sys', 'Sistema'], ['serif', 'Serif'], ['mono', 'Monoespaciada'], ['cond', 'Condensada'], ['elegant', 'Elegante'], ['script', 'Manuscrita']];
const LYR_FX = [['shadow', 'Sombra'], ['glow', 'Resplandor'], ['outline', 'Contorno'], ['blur', 'Desenfoque dinámico'], ['neonpulse', 'Neón pulsante'], ['retro', 'Retro 8-bit'], ['glitch', 'Glitch'], ['shimmer', 'Shimmer'], ['none', 'Ninguno']];

function lyrPanel(b) {
  const lab = (t) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = t; b.appendChild(d); };
  const chips = (arr, act, fn) => {
    const d = document.createElement('div'); d.className = 'chips';
    arr.forEach(([k, l]) => { const c = document.createElement('div'); c.className = 'chip' + (k === act ? ' act' : ''); c.textContent = l;
      c.onclick = () => { fn(k); [...d.children].forEach((x, i) => x.classList.toggle('act', arr[i][0] === k)); }; d.appendChild(c); });
    b.appendChild(d); return d;
  };
  const chk = (text, val, on) => { const l = document.createElement('label'); l.className = 'ck'; const i = document.createElement('input'); i.type = 'checkbox'; i.checked = val; i.onchange = () => on(i.checked); l.appendChild(i); l.appendChild(document.createTextNode(text)); b.appendChild(l); return i; };
  const refresh = () => { applyLyr(); lyLayout(); saveCfg(); };
  chk('Mostrar letras', CFG.lyr, (v) => { CFG.lyr = v; saveCfg(); if (v) loadLyrics(S.cur); else { S.lines = null; lyClear(); lyVis(); } });

  lab('Estilo');
  chips([['block', 'Bloque bajo el disco'], ['arc', 'Arco del vinilo'], ['word', 'Karaoke (palabra a palabra)']], CFG.lyrStyle, (k) => { CFG.lyrStyle = k; CFG.lyx = CFG.lyy = null; saveCfg(); lyClear(); lyVis(); lyLayout(); });
  lab('Tipografía'); chips(LYR_FONTS, CFG.lyFont, (k) => { CFG.lyFont = k; refresh(); });
  const d = document.createElement('div'); d.className = 'lbl'; const setT = (v) => (d.textContent = 'Tamaño de la letra: ' + v + '%'); setT(Math.round(CFG.lyk * 100)); b.appendChild(d);
  const r = document.createElement('input'); r.type = 'range'; r.min = 50; r.max = 250; r.value = Math.round(CFG.lyk * 100); r.style.accentColor = 'var(--c1)';
  r.oninput = () => { setT(+r.value); CFG.lyk = r.value / 100; applyLyr(); lyLayout(); }; r.onchange = saveCfg; b.appendChild(r);
  lab('Color');
  const ci = document.createElement('input'); ci.type = 'color'; ci.value = CFG.lyColor; ci.disabled = CFG.lyCover;
  ci.oninput = () => { CFG.lyColor = ci.value; applyLyr(); }; ci.onchange = saveCfg; b.appendChild(ci);
  chk('Usar el color de la portada', CFG.lyCover, (v) => { CFG.lyCover = v; ci.disabled = v; refresh(); });
  lab('Efecto'); chips(LYR_FX, CFG.lyFx, (k) => { CFG.lyFx = k; refresh(); });
  chk('Mayúsculas', CFG.lyCaps, (v) => { CFG.lyCaps = v; refresh(); });
  lab('Posición: arrastra la letra con el ratón. Ctrl + rueda sobre ella cambia el tamaño.');
  chk('Bloquear la posición de la letra', CFG.lyLock, (v) => { CFG.lyLock = v; saveCfg(); });
  const z = document.createElement('button'); z.className = 'btn g'; z.textContent = 'Restablecer posición de la letra';
  z.onclick = () => { CFG.lyx = CFG.lyy = null; lyLayout(); saveCfg(); }; b.appendChild(z);
}

let lastOver = false;
addEventListener('mousemove', (e) => { const o = !!e.target.closest('.hit'); if (o !== lastOver) { lastOver = o; D && D.ignoreMouse(!o); } });

new ResizeObserver(layout).observe(document.documentElement); setTimeout(layout, 500); setTimeout(layout, 1500);
